<!DOCTYPE html>
<html lang="kk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Робототехника — 300 сұрақ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f4ff;--card:#fff;--tx:#241b3d;--mu:#6f6890;--pr:#7c3aed;--pr2:#ede7ff;--ok:#16a34a;--okb:#dcfce7;--no:#dc2626;--nob:#fee2e2;--bd:#e2dcf5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15112a;--card:#1f1a3a;--tx:#f0ecff;--mu:#a49ec7;--pr:#a78bfa;--pr2:#2c2450;--ok:#4ade80;--okb:#14351f;--no:#f87171;--nob:#3b1818;--bd:#352d5c}}
:root[data-theme="dark"]{--bg:#15112a;--card:#1f1a3a;--tx:#f0ecff;--mu:#a49ec7;--pr:#a78bfa;--pr2:#2c2450;--ok:#4ade80;--okb:#14351f;--no:#f87171;--nob:#3b1818;--bd:#352d5c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:760px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0 4px}h2{font-size:21px;margin:0 0 12px}
.mu{color:var(--mu)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;margin-top:18px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:16px;cursor:pointer;text-align:left;color:inherit;font:inherit;transition:.15s}
.card:hover{border-color:var(--pr);transform:translateY(-2px)}
.card b{font-size:22px;display:block}
.bar{height:8px;background:var(--pr2);border-radius:8px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--pr)}
.btn{background:var(--pr);color:#fff;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
.btn.s{background:var(--pr2);color:var(--pr)}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.q{background:var(--card);border:2px solid var(--bd);border-radius:16px;padding:16px;margin:12px 0}
.q p{margin:0 0 10px;font-weight:600}
.o{display:flex;gap:10px;width:100%;text-align:left;background:var(--bg);border:2px solid var(--bd);color:inherit;font:inherit;border-radius:12px;padding:10px 12px;margin:6px 0;cursor:pointer}
.o span:first-child{font-weight:700;color:var(--pr);min-width:1.2em}
.o.ok{background:var(--okb);border-color:var(--ok)}.o.no{background:var(--nob);border-color:var(--no)}
.pb{height:10px;background:var(--pr2);border-radius:10px;overflow:hidden;margin:10px 0}.pb i{display:block;height:100%;background:var(--pr);transition:.3s}
label{cursor:pointer;user-select:none}
.big{font-size:56px;font-weight:800;color:var(--pr);margin:6px 0}
</style></head><body><div class="w" id="app"></div>
<script>
const Q=[{"n": 1, "q": "Робототехника дегеніміз не?", "o": ["Роботтарды әзірлеу, басқару және ақпаратты өңдеу технологиясы", "Өндірістік станоктарды механикалық жөндеу ғылымы", "Компьютерлік ойындар құрастыру тілі", "Электр желілерін жобалау саласы", "Бағдарламалық жасақтама саудасы"]}, {"n": 2, "q": "Робот дегеніміз не?", "o": ["Автоматты түрде жұмыс істейтін машина түрі", "Адамсыз басқарылмайтын механикалық құрылғы", "Есептеу жасайтын стационарлы компьютер", "Қашықтан басқарылатын қарапайым ойыншық", "Желіге қосылмаған дербес калькулятор"]}, {"n": 3, "q": "Робот қамтуы тиіс төрт негізгі функцияның біріншісі қандай?", "o": ["Манипуляциялау және жылжыту функциясы", "Қоршаған ортаны визуалды бақылау функциясы", "Нейрондық желіні оқыту функциясы", "Диалогтық жүйені іске қосу функциясы", "Сұйықтықтарды салқындату функциясы"]}, {"n": 4, "q": "Роботтың екінші функциясы қандай мүмкіндіктерді қамтиды?", "o": ["Қоршаған ортаның жай-күйін анықтау", "Бағдарламалық кодты өздігінен жазу", "Электр энергиясын өндіру және сақтау", "Дыбыстық сигналдарды тарату", "Моторларды автокөлікке бекіту"]}, {"n": 5, "q": "Роботтың үшінші функциясы (рефлексия мен шешім қабылдау) неге мүмкіндік береді?", "o": ["Мақсатқа жетуді жоспарлау және басқару", "Адаммен дауыстық диалог орнатуға", "Роботтың сыртқы пішінін өзгертуге", "Механикалық бөлшектерді майлауға", "Электр желісін тұрақты ұстауға"]}, {"n": 6, "q": "Адамның роботпен тиімді байланысын қамтамасыз ететін функция қайсысы?", "o": ["Диалогтық функция", "Сенсорлық функция", "Манипуляциялау функциясы", "Рефлексия функциясы", "Модельдеу функциясы"]}, {"n": 7, "q": "Алғашқы роботтарды жасау кезінде не үлгі ретінде алынды?", "o": ["Адамның қабілеттері", "Жануарлардың инстинкттері", "Табиғи апаттардың динамикасы", "Қарапайым өндірістік құралдар", "Өсімдіктердің құрылысы"]}, {"n": 8, "q": "Нақты өндірістік операцияларды орындайтын жасанды қол немесе аяқ жұмысын конструкциялайтын сала қалай аталады?", "o": ["Өнеркәсіптік робототехника", "Биомедициналық инженерия", "Мобильді бағдарламалау", "Кибернетикалық психология", "Аэроғарыштық механика"]}, {"n": 9, "q": "Робототехника бөлімдерінің ішінде қай сала ең қарқынды дамуда?", "o": ["Өнеркәсіптік робототехника", "Теңіз моллюскаларын зерттеу робототехникасы", "Тұрмыстық ойыншықтар жасау саласы", "Гардеробтық қызмет жүйелері", "Ауылдық су құбырлары робототехникасы"]}, {"n": 10, "q": "«Мехатроника» термині шамамен қай жылдары «электромеханика» концепциясының дамуы ретінде пайда болды?", "o": ["ХХ ғасырдың 80-ші жылдарында", "ХIX ғасырдың аяғында", "ХХІ ғасырдың 10-шы жылдарында", "ХХ ғасырдың 20-шы жылдарында", "ХVIII ғасырдың ортасында"]}, {"n": 11, "q": "Не себепті «мехатроника» термині робототехникаға қарағанда ауқымды болып табылады?", "o": ["Бұл салада робототехникаға жатпайтын жүйелер де бар", "Мехатроника ғарыштық аппараттарды зерттейді", "Анықтама бойынша роботтар мехатроникалық жүйеге жатпайды", "Мехатроника бағдарламалық қамтамасыз етуді қамтиды", "Бұл термин білім беру бағдарламаларында ғана қолданылады"]}, {"n": 12, "q": "Ядролық зерттеулер мен атом өнеркәсібі үшін алғашқы манипуляторлар қай жылдары жасалды?", "o": ["1940-1950 ж.ж.", "1910-1920 ж.ж.", "1980-1990 ж.ж.", "2000-2005 ж.ж.", "1890-1900 ж.ж."]}, {"n": 13, "q": "«Unimate» деп аталатын алғашқы өнеркәсіптік роботты қай фирма шығарды?", "o": ["Unimation", "Stanford Arm Group", "Mechanical Hand Corp", "Boston Dynamics", "Siemens Robotics"]}, {"n": 14, "q": "Оператордың көмегінсіз кірпіш блоктарын жинауға мүмкіндік берген «Mechanical Hand-I» жобасын кім әзірледі?", "o": ["Х. Эрнст", "Р. Нол", "Д. Девол", "Д. Энгельбергер", "А. Тьюринг"]}, {"n": 15, "q": "70-ші жылдардың басында «көз-құлақ-қол» сенсорлары бар мультимодальды ақпараттық жүйені құрған топты кім басқарды?", "o": ["Р. Нол", "Х. Эрнст", "Д. Блум", "Дж. Бокселл", "Н. Винер"]}, {"n": 16, "q": "Роботқа енгізілетін «интеллекттің» екі түрі ретінде дәрісте не атап өтілді?", "o": ["Бағдарламалық және нейрондық желі интеллектісі", "Механикалық гидравлика және пневматикалық интеллект", "Аналогтық сигналдық және релейлік интеллект", "Сенсорлық визуалды және акустикалық интеллект", "Сыртқы модульдік және кибернетикалық интеллект"]}, {"n": 17, "q": "Біологтардың ми құрылымдары бойынша модельденетін және компьютерлік көру, сөйлеуді тану сияқты мәселелерді табысты шешетін жасанды жүйе не болып табылады?", "o": ["Нейрондық желілер", "Эксперттік механикалық релелер", "Позициялық сызықтық датчиктер", "Манипуляторлық гидравликалық жүйелер", "Оптикалық конденсаторлар"]}, {"n": 18, "q": "Робототехникалық кешен (РТК) дегеніміз не?", "o": ["Автоматтандырылған құрылғылар мен өнеркәсіптік роботтар кешені", "Қолмен басқарылатын қарапайым аспаптар жиынтығы", "Компьютерлік бағдарламаларды жазуға арналған серверлік жүйе", "Ғарыштық станцияларды бақылайтын стационарлық орталық", "Автокөліктерді жууға арналған шағын бокс"]}, {"n": 19, "q": "Жаппай өндіріс, құрастыру, қайта өңдеу, дәнекерлеу және бояу жұмыстарына арналған РТК қай салалық топқа жатады?", "o": ["Өндірістік роботтар", "Әскери роботтар", "Ауыл шаруашылығы роботтары", "Қызмет көрсету роботтары", "Тұрмыстық ойын-сауық роботтары"]}, {"n": 20, "q": "Егін жинау, егіс алаңдарын өңдеу және мал шаруашылығын автоматтандыру үшін қолданылатын роботтар қай топқа жатады?", "o": ["Ауыл шаруашылығы роботтары", "Ғарыштық робототехникалық кешендер", "Қызмет көрсету роботтары", "Индустриалды роботтар", "Медициналық ассистенттер"]}, {"n": 21, "q": "Әуе кеңістігінде ұшатын, бақылау, тасымалдау және зерттеу жұмыстарын жүргізетін роботтар қалай аталады?", "o": ["Дрондар", "Манипуляторлар", "Шынжырлы роботтар", "Стационарлық құрылғылар", "Суасты батискафтары"]}, {"n": 22, "q": "Қашықтан басқару мен автономды басқару мүмкіндіктерін біріктіретін роботтар қалай аталады?", "o": ["Гибридті роботтар", "Автономды роботтар", "Қашықтан басқарылатын роботтар", "Жеке роботтар", "Статиқалық манипуляторлар"]}, {"n": 23, "q": "Өндіріс кәсіпорындарына роботты жүйелерді енгізудегі негізгі проблемалардың бірі не болып табылады?", "o": ["Сатып алу мен енгізудің жоғары құны, инвестиция қажеттілігі", "Өндірісте электр энергиясының толық болмауы", "Роботтардың өнім сапасын төмендетуі", "Мамандарды даярлаудың мүлдем мүмкін еместігі", "Нарықта металл шикізатының тапшылығы"]}, {"n": 24, "q": "РТК-да өнеркәсіптік роботтарды топтық басқару принципі не үшін қолданылады?", "o": ["Соқтығысуды болдырмау үшін", "Өндірістегі персонал санын арттыру үшін", "Электр қуатын екі есе артық жұмсау үшін", "Роботтардың қозғалыс жылдамдығын төмендету үшін", "Бағдарламалық кодтарды қайта жүктеу үшін"]}, {"n": 25, "q": "Басқаруды үйлестірудің бірінші кезеңінде қандай міндет шешіледі?", "o": ["Робот қозғалысын модельдеу арқылы ықтимал соқтығыстарды болжау", "Роботты желіден толық өшіру", "Қолданбалы бағдарламаларды қайта жазу", "Бөлшектерді қолмен тасымалдау", "Қозғалтқыштарды майлау"]}, {"n": 26, "q": "РТК басқару жүйесі орталықтандырылмаған схема бойынша жүзеге асырылғанда басқару қалай жүреді?", "o": ["Өзара байланысқан жергілікті құрылғылар арқылы", "Бір орталық компьютер арқылы", "Оператордың механикалық түймелерді басуы арқылы", "Автономды режимсіз, сыртқы радиосигналмен", "Апаттық релелік жүйе арқылы"]}, {"n": 27, "q": "Адамның қатысу дәрежесіне қарай роботты жүйелер қандай түрлерге бөлінеді?", "o": ["Автоматтандырылған және автоматты", "Циклдік және аналогтық", "Мобильді және стационарлы", "Механикалық және гидравликалық", "Ішкі және сыртқы"]}, {"n": 28, "q": "Роботты жүйелердің автоматтандырылған басқару режимінде адам қандай рөл атқарады?", "o": ["Негізгі немесе қосалқы операцияларды орындайды", "Кешенді мүлдем басқармайды", "Сырттан бақылаушы болады", "Роботтың ішкі бағдарламалық кодын қайта жазады", "Құрылғыны тоққа қосуды қамтамасыз етеді"]}, {"n": 29, "q": "Механикалық өңдеуге арналған автоматикалық роботты кешендерді құруда өнеркәсіптік роботты таңдауға әсер ететін негізгі факторлар қайсысы?", "o": ["Жүк көтергіштігі мен бөлшектердің салмағы", "Роботтың түсі мен сыртқы дизайны", "Өн
