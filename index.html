<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Дәріс №10: Экстремалды және ғарыштық робототехника - Тест</title>
<style>
        :root {
            --primary:#4f46e5;
            --primary-hover:#4338ca;
            --bg-color:#f3f4f6;
            --card-bg:#ffffff;
            --text-color:#1f2937;
            --correct:#10b981;
            --incorrect:#ef4444;
        }

        body {
            font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
            background-color:var(--bg-color);
            color:var(--text-color);
            margin:0;
            padding:20px;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .container {
            width:100%;
            max-width:800px;
            background:var(--card-bg);
            padding:30px;
            border-radius:16px;
            box-shadow:0 10px 25px rgba(0,0,0,.05);
            margin:20px 0;
        }

        h1 {
            font-size:1.4rem;
            color:var(--primary);
            text-align:center;
            margin-bottom:20px;
        }

        .quiz-header {
            display:flex;
            justify-content:space-between;
            margin-bottom:20px;
            font-size:.95rem;
            color:#6b7280;
            border-bottom:2px solid #e5e7eb;
            padding-bottom:10px;
        }

        .question-text {
            font-size:1.15rem;
            font-weight:600;
            margin-bottom:20px;
        }

        .options-grid {
            display:flex;
            flex-direction:column;
            gap:12px;
        }

        .option-btn {
            background:#f9fafb;
            border:2px solid #e5e7eb;
            padding:14px 18px;
            border-radius:10px;
            font-size:1rem;
            text-align:left;
            cursor:pointer;
            transition:all .2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background:#ede9fe;
            border-color:var(--primary);
        }

        .option-btn.correct {
            background:#d1fae5;
            border-color:var(--correct);
            color:#065f46;
        }

        .option-btn.incorrect {
            background:#fee2e2;
            border-color:var(--incorrect);
            color:#991b1b;
        }

        .next-btn {
            margin-top:25px;
            background:var(--primary);
            color:#fff;
            border:none;
            padding:12px 24px;
            font-size:1rem;
            border-radius:8px;
            cursor:pointer;
            width:100%;
            transition:background .2s;
            display:none;
        }

        .next-btn:hover {
            background:var(--primary-hover);
        }

        .result-screen {
            display:none;
        }

        .dashboard-header {
            text-align:center;
            margin-bottom:25px;
        }

        .dashboard-header h2 {
            font-size:1.8rem;
            color:var(--primary);
            margin-bottom:10px;
        }

        .stats-cards {
            display:flex;
            gap:15px;
            margin-bottom:25px;
        }

        .stat-card {
            flex:1;
            padding:15px;
            border-radius:12px;
            text-align:center;
            color:#fff;
            font-weight:bold;
        }

        .stat-card.total {
            background:var(--primary);
        }

        .stat-card.correct {
            background:var(--correct);
        }

        .stat-card.incorrect {
            background:var(--incorrect);
        }

        .stat-card span {
            display:block;
            font-size:1.5rem;
            margin-top:5px;
        }

        .review-list {
            max-height:400px;
            overflow-y:auto;
            display:flex;
            flex-direction:column;
            gap:15px;
            padding-right:5px;
        }

        .review-item {
            padding:15px;
            border-radius:10px;
            border:1px solid #e5e7eb;
            background:#f9fafb;
        }

        .review-item.is-correct {
            border-left:5px solid var(--correct);
        }

        .review-item.is-incorrect {
            border-left:5px solid var(--incorrect);
        }

        .review-question {
            font-weight:600;
            margin-bottom:8px;
        }

        .review-answer {
            font-size:.95rem;
            margin:4px 0;
        }

        .review-answer span {
            font-weight:600;
        }

        .user-ans {
            color:#4b5563;
        }

        .correct-ans {
            color:var(--correct);
        }

        .restart-btn {
            background:var(--primary);
            color:#fff;
            border:none;
            padding:12px 24px;
            font-size:1rem;
            border-radius:8px;
            cursor:pointer;
            width:100%;
            margin-top:20px;
            transition:background .2s;
        }

        .restart-btn:hover {
            background:var(--primary-hover);
        }
</style>
</head>
<body>

    <div class="container">
    <div id="quiz-screen">
    <h1>Дәріс №10: Өнеркәсіптегі экстремалды және ғарыштық робототехника</h1>
    <div class="quiz-header">
    <span id="question-counter">Сұрақ: 1 / 30</span>
    <span id="score-counter">Ұпай: 0</span>
    </div>
    <div class="question-text" id="question">Сұрақ жүктелуде...</div>
    <div class="options-grid" id="options">
    </div>
    <button class="next-btn" id="next-btn" onclick="nextQuestion()">Келесі сұрақ</button>
    </div>
    <div class="result-screen" id="result-screen">
    <div class="dashboard-header">
    <h2>Тест нәтижелері 📊</h2>
    <p>Барлық сұрақтар бойынша талдау және статистика</p>
    </div>
    <div class="stats-cards">
    <div class="stat-card total">Барлығы<span id="stat-total">30</span>
    </div>
    <div class="stat-card correct">Дұрыс<span id="stat-correct">0</span>
    </div>
    <div class="stat-card incorrect">Қате<span id="stat-incorrect">0</span>
    </div>
    </div>
    <h3 style="margin-bottom:10px;font-size:1.1rem;">Жауаптар тізімі:</h3>
    <div class="review-list" id="review-list">
    </div>
    <button class="restart-btn" onclick="restartQuiz()">Тестті қайта бастау</button>
    </div>
    </div>
    
<script>
    // correct: дұрыс жауаптың индексі (0 = бірінші). Жауап варианттары көрсету кезінде араласады.
    const quizData = [
        {
            question: "Экстремалды робототехника дегеніміз не?",
            options: [
                "Роботтарды адам үшін қауіпті, қатал немесе қол жетпейтін жағдайларда қолдану саласы",
                "Роботтарды тек үй шаруашылығында қолдану саласы",
                "Роботтарды тек ойын-сауық үшін жасау",
                "Адамдарды роботтармен толық алмастыру саласы"
            ],
            correct: 0
        },
        {
            question: "Терең теңіз астындағы құбырларды орнату және тексеру үшін қандай роботтар қолданылады?",
            options: [
                "Суасты роботтары (ROV)",
                "Ұшатын дрондар",
                "Рельсті арбалар",
                "Тұрмыстық шаңсорғыштар"
            ],
            correct: 0
        },
        {
            question: "ROV аббревиатурасы қалай ашылады?",
            options: [
                "Remotely Operated Vehicles",
                "Robot Operated Vessel",
                "Rapid Orbital Vehicle",
                "Remote Optical Video"
            ],
            correct: 0
        },
        {
            question: "Тау-кен өнеркәсібінде сенсорлармен жабдықталған роботтар нені бақылайды?",
            options: [
                "Жер асты қозғалыстарын және газдың жиналуын",
                "Қонақтардың санын",
                "Ауа райы болжамын",
                "Сатылым көлемін"
            ],
            correct: 0
        },
        {
            question: "Қандай аварияларды жоюда роботтар қолданылды?",
            options: [
                "Чернобыль және Фукусима",
                "Титаник және Хинденбург",
                "Аполлон-13 және Челленджер",
                "Бхопал және Севезо"
            ],
            correct: 0
        },
        {
            question: "Ядролық энергетикада радиацияға төзімді роботтар не үшін қолданылады?",
            options: [
                "Қауіпті радиация аймағында қызмет көрсету, жөндеу және бақылау",
                "Электр тогын арзандату үшін",
                "Реакторды желден қорғау үшін",
                "Қызметкерлерді оқыту үшін"
            ],
            correct: 0
        },
        {
            question: "Теңіз өнеркәсібінде роботтар кемелерде қандай жұмыс атқарады?",
            options: [
                "Суға батырылған бөліктерді тексеру және тазалау",
                "Желкенді көтеру",
                "Балық аулау лицензиясын беру",
                "Жолаушыларға билет сату"
            ],
            correct: 0
        },
        {
            question: "Қорғаныс және қауіпсіздік саласында роботтар не үшін қолданылады?",
            options: [
                "Жарылғыш құрылғыларды анықтау және залалсыздандыру",
                "Футбол ойнау",
                "Тағам дайындау",
                "Сабақ беру"
            ],
            correct: 0
        },
        {
            question: "Болат құю процесінде роботтар не істейді?",
            options: [
                "Ыстық металды өңдеу және тасымалдау",
                "Металды мұздату",
                "Сызба сызу",
                "Руда іздеу"
            ],
            correct: 0
        },
        {
            question: "Экстремалды роботтардағы датчиктерге қайсысы жатады?",
            options: [
                "Көру, термобақылау, газды анықтау және ультрадыбыстық датчиктер",
                "Тек дыбыс жазу датчиктері",
                "Тек GPS-навигация",
                "Тек сенсорлық экран"
            ],
            correct: 0
        },
        {
            question: "Оператор экстремалды роботты қайдан басқарады?",
            options: [
                "Қауіпсіз жерден",
                "Қауіпті аймақтың дәл ішінен",
                "Тек ғарыш станциясынан",
                "Тек теңіз түбінен"
            ],
            correct: 0
        },
        {
            question: "Ғарыштық робототехника дегеніміз не?",
            options: [
                "Роботтарды ғарышты зерттеу және ғарыштық миссияларды орындау үшін қолданатын ғылым мен инженерия саласы",
                "Ғарышкерлерді даярлау ғылымы",
                "Зымыран отынын өндіру саласы",
                "Телескоп линзаларын жасау өнері"
            ],
            correct: 0
        },
        {
            question: "Марсты зерттейтін марсоходтарға қайсысы жатады?",
            options: [
                "Curiosity және Perseverance",
                "Voyager және Pioneer",
                "Hubble және Webb",
                "Canadarm-2 және Robonaut"
            ],
            correct: 0
        },
        {
            question: "Canadarm-2 робот қолы қайда орнатылған?",
            options: [
                "Халықаралық ғарыш станциясында",
                "Айда",
                "Марста",
                "Voyager зондында"
            ],
            correct: 0
        },
        {
            question: "Күн жүйесінің шекарасын зерттеу үшін қандай зондтар қолданылады?",
            options: [
                "Voyager, Pioneer және New Horizons",
                "Curiosity, Opportunity және Spirit",
                "Луноход-1 және Луноход-2",
                "Hubble, Webb және Kepler"
            ],
            correct: 0
        },
        {
            question: "Қандай ғарыш телескоптары аталған?",
            options: [
                "Hubble және James Webb",
                "Voyager және Pioneer",
                "Curiosity және Perseverance",
                "Lunar Rover және Canadarm"
            ],
            correct: 0
        },
        {
            question: "Ғарыштық роботтар энергия көзі ретінде нені пайдаланады?",
            options: [
                "Күн батареялары мен радиоизотоптық термоэлектрлік генераторларды (RTG)",
                "Бензин қозғалтқыштарын",
                "Көмір мен отынды",
                "Жел турбиналарын"
            ],
            correct: 0
        },
        {
            question: "Ғарыштық роботқа қойылатын талапқа қайсысы жатпайды?",
            options: [
                "Мүмкіндігінше көп салмақ",
                "Мүмкіндігінше аз салмақ",
                "Өте сенімді болу",
                "Автоматты түрде жұмыс істеу"
            ],
            correct: 0
        },
        {
            question: "Марсқа адам жіберудің болжамды құны қанша?",
            options: [
                "Шамамен 200–300 миллиард доллар",
                "Шамамен 5–10 миллиард доллар",
                "Шамамен 1 миллиард доллар",
                "Шамамен 1 триллион доллар"
            ],
            correct: 0
        },
        {
            question: "Бортында роботы бар ғарыш кемесін жіберу шамамен қанша тұрады?",
            options: [
                "Шамамен 5–10 миллиард доллар",
                "Шамамен 200–300 миллиард доллар",
                "Шамамен 50 мың доллар",
                "Шамамен 1 триллион доллар"
            ],
            correct: 0
        },
        {
            question: "Луноход-1 дегеніміз не?",
            options: [
                "Айда сәтті жұмыс істеген әлемдегі алғашқы қашықтан басқарылатын өздігінен жүретін көлік",
                "Марсты зерттейтін ғарыш зонды",
                "Орбитадағы ғарыш телескопы",
                "ХҒС-тағы робот қол"
            ],
            correct: 0
        },
        {
            question: "Луноход-1 Айдың бетіне қашан жеткізілді?",
            options: [
                "1970 жылы 17 қарашада",
                "1957 жылы 4 қазанда",
                "1969 жылы 20 шілдеде",
                "1986 жылы 26 сәуірде"
            ],
            correct: 0
        },
        {
            question: "Луноход-1-ді Айға қандай станция жеткізді?",
            options: [
                "Кеңестік Луна-17 планетааралық станциясы",
                "Аполлон-11",
                "Вояджер-1",
                "Союз-19"
            ],
            correct: 0
        },
        {
            question: "Луноход-1-дің салмағы қанша?",
            options: [
                "756 кг",
                "75 кг",
                "7 560 кг",
                "1 200 кг"
            ],
            correct: 0
        },
        {
            question: "Луноход-1-дің қанша доңғалағы болды?",
            options: [
                "Сегіз",
                "Төрт",
                "Алты",
                "Он екі"
            ],
            correct: 0
        },
        {
            question: "Луноход-1 электр қуатын қайдан алды?",
            options: [
                "Қақпағына орнатылған 180 Вт күн батареясынан",
                "Ядролық реактордан",
                "Жанармай багынан",
                "Жерден сым арқылы"
            ],
            correct: 0
        },
        {
            question: "Луноход-1 қанша қашықтық жүріп өтті?",
            options: [
                "10 540 метр",
                "1 054 метр",
                "105 километр",
                "540 метр"
            ],
            correct: 0
        },
        {
            question: "SAR-401 роботының басқару принципі қандай?",
            options: [
                "Арнайы костюм киген оператордың қимылдарын андроид қайталайды",
                "Робот тек алдын ала жазылған бағдарламамен жүреді",
                "Робот дыбыстық командамен ғана басқарылады",
                "Басқару тек сымсыз пультпен жүреді"
            ],
            correct: 0
        },
        {
            question: "Robonaut 2 қанша сенсор мен процессормен жабдықталған?",
            options: [
                "350 сенсор және 38 процессор",
                "38 сенсор және 350 процессор",
                "10 сенсор және 5 процессор",
                "1 000 сенсор және 100 процессор"
            ],
            correct: 0
        },
        {
            question: "Robonaut технологиялары негізінде жер үсті жағдайына қандай құрылғылар ұсынылды?",
            options: [
                "«Роботтық қолғап» және «робокарка»",
                "Электромобиль мен дрон",
                "Смартфон мен планшет",
                "Шаңсорғыш пен тоңазытқыш"
            ],
            correct: 0
        }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let answered = false;
    let userAnswers = [];

    const questionCounter = document.getElementById('question-counter');
    const scoreCounter = document.getElementById('score-counter');
    const questionElement = document.getElementById('question');
    const optionsElement = document.getElementById('options');
    const nextBtn = document.getElementById('next-btn');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');

    function loadQuestion() {
        answered = false;
        nextBtn.style.display = 'none';

        let currentQuestion = quizData[currentQuestionIndex];
        questionCounter.innerText = `Сұрақ: ${currentQuestionIndex + 1} / ${quizData.length}`;
        scoreCounter.innerText = `Ұпай: ${score}`;
        questionElement.innerText = currentQuestion.question;

        optionsElement.innerHTML = '';

        // Жауап варианттарын араластыру
        const order = currentQuestion.options
            .map((_, i) => i)
            .sort(() => Math.random() - 0.5);

        order.forEach(index => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = currentQuestion.options[index];
            btn.dataset.i = index;
            btn.onclick = () => selectOption(index, btn);
            optionsElement.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, selectedBtn) {
        if (answered) return;
        answered = true;

        let currentQuestion = quizData[currentQuestionIndex];
        const allButtons = optionsElement.getElementsByClassName('option-btn');

        let isCorrect = (selectedIndex === currentQuestion.correct);
        if (isCorrect) {
            selectedBtn.classList.add('correct');
            score++;
            scoreCounter.innerText = `Ұпай: ${score}`;
        } else {
            selectedBtn.classList.add('incorrect');
            Array.from(allButtons)
                .find(b => +b.dataset.i === currentQuestion.correct)
                .classList.add('correct');
        }

        userAnswers.push({
            question: currentQuestion.question,
            userAnswer: currentQuestion.options[selectedIndex],
            correctAnswer: currentQuestion.options[currentQuestion.correct],
            isCorrect: isCorrect
        });

        Array.from(allButtons).forEach(btn => btn.disabled = true);
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showDashboard();
        }
    }

    function showDashboard() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';

        document.getElementById('stat-total').innerText = quizData.length;
        document.getElementById('stat-correct').innerText = score;
        document.getElementById('stat-incorrect').innerText = quizData.length - score;

        const reviewList = document.getElementById('review-list');
        reviewList.innerHTML = '';

        userAnswers.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = `review-item ${item.isCorrect ? 'is-correct' : 'is-incorrect'}`;
            div.innerHTML = `
                <div class="review-question">${index + 1}. ${item.question}</div>
                <div class="review-answer user-ans">Сіздің жауабыңыз: <span>${item.userAnswer}</span></div>
                ${!item.isCorrect ? `<div class="review-answer correct-ans">Дұрыс жауап: <span>${item.correctAnswer}</span></div>` : ''}
            `;
            reviewList.appendChild(div);
        });
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        userAnswers = [];
        quizScreen.style.display = 'block';
        resultScreen.style.display = 'none';
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
