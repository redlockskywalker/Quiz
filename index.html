<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Робототехника және өнеркәсіптік емес секторлар - Нәтижелер</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
            --text-color: #1f2937;
            --correct: #10b981;
            --incorrect: #ef4444;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            margin: 20px 0;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--primary);
            text-align: center;
            margin-bottom: 20px;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            font-size: 0.95rem;
            color: #6b7280;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }

        .question-text {
            font-size: 1.15rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: #ede9fe;
            border-color: var(--primary);
        }

        .option-btn.correct {
            background: #d1fae5;
            border-color: var(--correct);
            color: #065f46;
        }

        .option-btn.incorrect {
            background: #fee2e2;
            border-color: var(--incorrect);
            color: #991b1b;
        }

        .next-btn {
            margin-top: 25px;
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
            display: none;
        }

        .next-btn:hover {
            background: var(--primary-hover);
        }

        /* Дэшборд стильдері */
        .result-screen {
            display: none;
        }

        .dashboard-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .dashboard-header h2 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .stats-cards {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            flex: 1;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            color: white;
            font-weight: bold;
        }

        .stat-card.total { background: var(--primary); }
        .stat-card.correct { background: var(--correct); }
        .stat-card.incorrect { background: var(--incorrect); }

        .stat-card span {
            display: block;
            font-size: 1.5rem;
            margin-top: 5px;
        }

        .review-list {
            max-height: 400px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-right: 5px;
        }

        .review-item {
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e5e7eb;
            background: #f9fafb;
        }

        .review-item.is-correct {
            border-left: 5px solid var(--correct);
        }

        .review-item.is-incorrect {
            border-left: 5px solid var(--incorrect);
        }

        .review-question {
            font-weight: 600;
            margin-bottom: 8px;
        }

        .review-answer {
            font-size: 0.95rem;
            margin: 4px 0;
        }

        .review-answer span {
            font-weight: 600;
        }

        .user-ans { color: #4b5563; }
        .correct-ans { color: var(--correct); }

        .restart-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: background 0.2s;
        }

        .restart-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>

</div>

    const optionsElement = document.getElementById('options');
    const nextBtn = document.getElementById('next-btn');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');

    function loadQuestion() {
        answered = false;
        nextBtn.style.display = 'none';
        
        let currentQuestion = quizData[currentQuestionIndex];
        questionCounter.innerText = `Сұрақ: ${currentQuestionIndex + 1} / ${quizData.length}`;
        scoreCounter.innerText = `Ұпай: ${score}`;
        questionElement.innerText = currentQuestion.question;

        optionsElement.innerHTML = '';
        currentQuestion.options.forEach((option, index) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = option;
            btn.onclick = () => selectOption(index, btn);
            optionsElement.appendChild(btn);
        });
    }

    function selectOption(selectedIndex, selectedBtn) {
        if (answered) return;
        answered = true;

        let currentQuestion = quizData[currentQuestionIndex];
        const allButtons = optionsElement.getElementsByClassName('option-btn');

        let isCorrect = (selectedIndex === currentQuestion.correct);
        if (isCorrect) {
            selectedBtn.classList.add('correct');
            score++;
            scoreCounter.innerText = `Ұпай: ${score}`;
        } else {
            selectedBtn.classList.add('incorrect');
            allButtons[currentQuestion.correct].classList.add('correct');
        }

        userAnswers.push({
            question: currentQuestion.question,
            userAnswer: currentQuestion.options[selectedIndex],
            correctAnswer: currentQuestion.options[currentQuestion.correct],
            isCorrect: isCorrect
        });

        Array.from(allButtons).forEach(btn => btn.disabled = true);
        nextBtn.style.display = 'block';
    }

    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizData.length) {
            loadQuestion();
        } else {
            showDashboard();
        }
    }

    function showDashboard() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';

        document.getElementById('stat-total').innerText = quizData.length;
        document.getElementById('stat-correct').innerText = score;
        document.getElementById('stat-incorrect').innerText = quizData.length - score;

        const reviewList = document.getElementById('review-list');
        reviewList.innerHTML = '';

        userAnswers.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = `review-item ${item.isCorrect ? 'is-correct' : 'is-incorrect'}`;
            div.innerHTML = `
                <div class="review-question">${index + 1}. ${item.question}</div>
                <div class="review-answer user-ans">Сіздің жауабыңыз: <span>${item.userAnswer}</span></div>
                ${!item.isCorrect ? `<div class="review-answer correct-ans">Дұрыс жауап: <span>${item.correctAnswer}</span></div>` : ''}
            `;
            reviewList.appendChild(div);
        });
    }

    function restartQuiz() {
        currentQuestionIndex = 0;
        score = 0;
        userAnswers = [];
        quizScreen.style.display = 'block';
        resultScreen.style.display = 'none';
        loadQuestion();
    }

    loadQuestion();
</script>

</body>
</html>
